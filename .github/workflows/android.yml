name: Bangun APK ForgeFit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
      - name: Periksa JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Periksa kelengkapan UI
        run: python3 tests/check_ui.py
      - name: Kompilasi APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: ForgeFit-pratinjau-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
