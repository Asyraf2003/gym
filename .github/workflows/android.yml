name: ForgeFit Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Periksa Android SDK runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Periksa JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Test Guided Workout
        run: |
          node --check app/src/main/assets/guided.js
          node --check app/src/main/assets/progress.js
          node --check app/src/main/assets/progress-ui.js
          node --check app/src/main/assets/notify.js
          node --check app/src/main/assets/recommend.js
          node --test tests/guided.test.cjs tests/guided_ui.test.cjs tests/progress.test.cjs tests/progress_ui.test.cjs tests/notify_ui.test.cjs tests/picker_ui.test.cjs tests/recommend.test.cjs
      - name: Test Reminder Scheduler (Java)
        run: |
          mkdir -p /tmp/forgefit-notify-test
          javac -d /tmp/forgefit-notify-test app/src/main/java/id/forgefit/app/ReminderPlanner.java tests/java/id/forgefit/app/ReminderPlannerTest.java
          java -cp /tmp/forgefit-notify-test id.forgefit.app.ReminderPlannerTest
      - name: Periksa kelengkapan UI
        run: python3 tests/check_ui.py
      - name: Kompilasi APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: ForgeFit-v1.0.0-CI-Debug-Not-For-Distribution
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
